name: bot_taximeter_pro
description: Ứng dụng đồng hồ cước taxi hỗ trợ tài xế, sử dụng cá nhân.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.5.0
  go_router: 18.1.4
  google_fonts: 8.1.0
  fl_chart: 1.3.1
  qr_flutter: 4.1.0
  shared_preferences: 2.5.6
  google_maps_flutter: 2.19.0
  geolocator: 14.1.2
  permission_handler: 12.0.3
  wakelock_plus: 1.8.0
  sqflite: 2.4.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/map_styles/dark.json
    - assets/map_styles/light.json
